name: cartridge-ci
on:
  push:
    branches: ["feat/maxx-cartridge-icm", "main"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Init and validate USB cartridge
        run: python cartridge/maxx_cartridge.py --root .cartridge-test init --agent "Agent Max" --medium usb
      - name: Validate cartridge
        run: python cartridge/maxx_cartridge.py --root .cartridge-test validate
